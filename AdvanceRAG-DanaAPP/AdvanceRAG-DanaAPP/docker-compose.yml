services:
  backend:
    build:
      context: ./backend
    container_name: dana-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/app.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DEFAULT_LLM_BASE_URL: ${DEFAULT_LLM_BASE_URL:-https://api.gapgpt.app/v1}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gapgpt-qwen-3.6}
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the frontend at build time. If you access the app from
        # another machine (not localhost), change this to that machine's
        # address, e.g. http://192.168.1.10:8000, and rebuild.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: dana-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
